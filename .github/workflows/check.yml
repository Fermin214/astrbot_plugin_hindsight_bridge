name: Plugin checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: plugin-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      host: ${{ steps.scope.outputs.host }}
      qq: ${{ steps.scope.outputs.qq }}
      weixin: ${{ steps.scope.outputs.weixin }}
      models: ${{ steps.scope.outputs.models }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks for changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).splitlines()

          base = os.environ.get("BASE_SHA", "")
          try:
              files = git("diff", "--name-only", base, os.environ["HEAD_SHA"]) if (
                  base.strip("0") and os.environ["FULL_CHECK"] != "true"
              ) else git("ls-files")
          except subprocess.CalledProcessError:
              files = git("ls-files")
          code = [name for name in files if not name.endswith((".md", ".png", ".svg"))]
          python = any(
              name == "main.py" or name.startswith(("core/", "deploy/", "examples/"))
              or (name.startswith("tests/test_") and name.endswith(".py"))
              or name in {"requirements.txt", "requirements-dev.txt", "_conf_schema.json", "tests/run.py", "tests/queue_fixture.py",
                          "tools/check-package.py", "tools/build-test-package.py"}
              for name in code
          )
          frontend = any(
              (name.startswith("views/") and name.endswith((".js", ".html", ".css")))
              or name in {"tests/test_memory_view.mjs", "tests/integration/background_view.py"}
              for name in code
          )
          host = any(
              name == "main.py" or name.startswith(("core/", ".astrbot-plugin/"))
              or name in {"requirements.txt", "_conf_schema.json", "metadata.yaml",
                          "tests/integration/astrbot_smoke.py", "tests/integration/package_fixture.py",
                          "tests/integration/lark_source_contracts.py",
                          "tests/integration/telegram_source_contracts.py", ".github/workflows/check.yml"}
              for name in code
          )
          models = bool(set(code) & {
              "core/providers.py", "deploy/model_transport.py", "deploy/model_probe.py",
              "tools/check-model-protocols.py", "requirements.txt", "deploy/compose.yaml",
          })
          shared_sources = {
              "main.py", "core/source.py", "core/identity.py", "core/access.py", "core/permissions.py",
              "core/control.py", "core/outbox.py", "core/materials.py", "requirements.txt",
              "tests/integration/astrbot_smoke.py", ".github/workflows/check.yml",
          }
          qq = bool(set(code) & (shared_sources | {"core/qq_source.py", "tests/integration/qq_source_contracts.py"}))
          weixin = (bool(set(code) & (shared_sources | {"core/weixin_source.py", "tests/integration/weixin_source_contracts.py"}))
                    or any(name.startswith("tests/integration/platform_probe/") for name in code))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, enabled in (("python", python), ("frontend", frontend), ("host", host), ("models", models),
                                    ("qq", qq), ("weixin", weixin)):
                  output.write(f"{name}={str(enabled).lower()}\n")
          print("Selected:", ", ".join(name for name, enabled in (
              ("regressions", python), ("page", frontend), ("host", host), ("models", models),
              ("QQ contracts", qq), ("Weixin contracts", weixin),
          ) if enabled) or "syntax, metadata, package and documentation")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -c "import pathlib, subprocess; [subprocess.run(['node', '--check', str(p)], check=True) for p in pathlib.Path('views/memory').glob('*.js')]"
      - if: steps.scope.outputs.python == 'true'
        run: python tests/run.py
      - if: steps.scope.outputs.frontend == 'true' && steps.scope.outputs.python != 'true'
        run: node tests/test_memory_view.mjs
      - name: Knowledge page saves and polling in Chromium
        if: steps.scope.outputs.frontend == 'true'
        timeout-minutes: 8
        env:
          BRIDGE_BROWSER_OUTPUT: ${{ runner.temp }}/hindsight-browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python tests/integration/background_view.py
      - name: Check plugin package and release version
        env:
          RELEASE_BASE: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$RELEASE_BASE" ]; then
            python tools/check-package.py --release-base "$RELEASE_BASE"
          else
            python tools/check-package.py
          fi

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -c "import pathlib, subprocess; [subprocess.run(['node', '--check', str(p)], check=True) for p in pathlib.Path('views/memory').glob('*.js')]"
      - run: python tests/run.py
      - run: python tools/check-package.py
      - name: Install AstrBot 4.29.4
        run: python -m pip install --only-binary=astrbot "AstrBot==4.29.4"
      - name: Install, upgrade and reload Bridge in AstrBot
        env:
          ASTRBOT_TEST_VERSION: "4.29.4"
          ASTRBOT_DISABLE_METRICS: "1"
        run: |
          $env:DELIVERY_ROOT = Join-Path $env:RUNNER_TEMP 'hindsight-delivery'
          $env:ASTRBOT_ROOT = Join-Path $env:RUNNER_TEMP 'AstrBot 数据'
          python tools/build-test-package.py --distribution --output "$env:DELIVERY_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/astrbot_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-astrbot-smoke
          path: ${{ runner.temp }}/hindsight-delivery/astrbot-smoke-report.json
          if-no-files-found: error

  astrbot-smoke:
    needs: check
    if: needs.check.outputs.host == 'true' || needs.check.outputs.qq == 'true' || needs.check.outputs.weixin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ["4.29.1", "4.29.4"]
        platform: ${{ fromJSON(needs.check.outputs.host == 'true' && '["aiocqhttp","lark","telegram"]' || '["lark"]') }}
        exclude:
          - version: "4.29.4"
            platform: aiocqhttp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build-test-package.py --distribution --output "${{ runner.temp }}/hindsight-delivery"
      - name: Official AstrBot archive installation, requests, history and upgrade
        shell: bash
        run: |
          docker run --rm --name hindsight-bridge-delivery-astrbot \
            --label hindsight-bridge.test=delivery --memory 1536m \
            -e ASTRBOT_ROOT=/verification \
            -e ASTRBOT_TEST_VERSION=${{ matrix.version }} \
            -e ASTRBOT_PLATFORM_FIXTURE=${{ matrix.platform }} \
            -e RUN_QQ_CONTRACTS=${{ needs.check.outputs.qq }} \
            -e RUN_WEIXIN_CONTRACTS=${{ needs.check.outputs.weixin }} \
            -e ASTRBOT_DASHBOARD_INITIAL_PASSWORD='Delivery-Test-2026!' \
            -v "${{ runner.temp }}/hindsight-delivery:/delivery" \
            -v "${{ github.workspace }}:/candidate-source:ro" \
            soulter/astrbot:v${{ matrix.version }} \
            sh -ec '
              python /candidate-source/tests/integration/astrbot_smoke.py
              if [ "$ASTRBOT_PLATFORM_FIXTURE" = lark ]; then
                ASTRBOT_ROOT=/contracts python /candidate-source/tests/integration/lark_source_contracts.py \
                  --output /delivery/lark-contracts.json
                if [ "$RUN_QQ_CONTRACTS" = true ]; then
                  for transport in qq_official qq_official_webhook; do
                    ASTRBOT_ROOT="/contracts-$transport" QQ_TRANSPORT="$transport" \
                      python /candidate-source/tests/integration/qq_source_contracts.py \
                      > "/delivery/$transport-contracts.log"
                  done
                fi
                if [ "$RUN_WEIXIN_CONTRACTS" = true ]; then
                  ASTRBOT_ROOT=/contracts-weixin python /candidate-source/tests/integration/weixin_source_contracts.py \
                    --output /delivery/weixin-contracts.json
                fi
              elif [ "$ASTRBOT_PLATFORM_FIXTURE" = telegram ]; then
                ASTRBOT_ROOT=/contracts python /candidate-source/tests/integration/telegram_source_contracts.py \
                  --output /delivery/telegram-contracts.json
              fi
            ' \
            2>&1 | tee "${{ runner.temp }}/hindsight-delivery/astrbot-smoke.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astrbot-delivery-evidence-${{ matrix.version }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/hindsight-delivery

  hindsight-model-contracts:
    needs: check
    if: needs.check.outputs.models == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        hindsight: ["1.1.0", "1.2.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Hindsight model SDK contracts against local fixtures
        run: |
          docker run --rm --name hindsight-bridge-delivery-models \
            --label hindsight-bridge.test=delivery --network none --memory 1536m \
            -e HINDSIGHT_TEST_VERSION=${{ matrix.hindsight }} \
            -v "${{ github.workspace }}:/verify/plugins/astrbot_plugin_hindsight_bridge:ro" \
            -w /verify/plugins/astrbot_plugin_hindsight_bridge \
            ghcr.io/vectorize-io/hindsight:${{ matrix.hindsight }}-slim \
            python tools/check-model-protocols.py
