name: Plugin checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: plugin-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: node --check views/memory/app.js
      - run: python tests/run.py
      - run: python tools/check-package.py

  astrbot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build-test-package.py --output "${{ runner.temp }}/hindsight-delivery"
      - name: Official AstrBot archive installation, requests, history and upgrade
        run: |
          docker run --rm --name hindsight-bridge-delivery-astrbot \
            --label hindsight-bridge.test=delivery --memory 1536m \
            -e ASTRBOT_ROOT=/verification \
            -e ASTRBOT_DASHBOARD_INITIAL_PASSWORD='Delivery-Test-2026!' \
            -v "${{ runner.temp }}/hindsight-delivery:/delivery" \
            -v "${{ github.workspace }}:/candidate-source:ro" \
            soulter/astrbot:v4.29.1 \
            python /candidate-source/tests/integration/astrbot_smoke.py \
            2>&1 | tee "${{ runner.temp }}/hindsight-delivery/astrbot-smoke.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astrbot-delivery-evidence
          path: ${{ runner.temp }}/hindsight-delivery

  hindsight-model-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        hindsight: ["1.1.0", "1.2.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Hindsight model SDK contracts against local fixtures
        run: |
          docker run --rm --name hindsight-bridge-delivery-models \
            --label hindsight-bridge.test=delivery --network none --memory 1536m \
            -e HINDSIGHT_TEST_VERSION=${{ matrix.hindsight }} \
            -v "${{ github.workspace }}:/verify/plugins/astrbot_plugin_hindsight_bridge:ro" \
            -w /verify/plugins/astrbot_plugin_hindsight_bridge \
            ghcr.io/vectorize-io/hindsight:${{ matrix.hindsight }}-slim \
            python tools/check-model-protocols.py

  managed-installation-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Real legacy permission failure, revised image and preserved-data retry
        run: python tests/integration/install_startup.py --output "${{ runner.temp }}/installer-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-installation-startup-evidence
          path: |
            ${{ runner.temp }}/installer-evidence/result.json
            ${{ runner.temp }}/installer-evidence/*.log

  memory-parameters:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: existing
            astrbot: "4.29.1"
            hindsight: "1.1.0"
          - mode: existing
            astrbot: "4.29.4"
            hindsight: "1.2.0"
          - mode: managed
            astrbot: "4.29.4"
            hindsight: "1.2.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: docker build -t hindsight-bridge-delivery-postgres:17 deploy/postgres
      - name: Native parameter save, long-page chat and reload persistence
        run: |
          python tools/run-parameters-e2e.py \
            --mode "${{ matrix.mode }}" \
            --astrbot-version "${{ matrix.astrbot }}" \
            --hindsight-version "${{ matrix.hindsight }}" \
            --output "${{ runner.temp }}/parameter-evidence" \
            2>&1 | tee "${{ runner.temp }}/parameters.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parameters-${{ matrix.mode }}-${{ matrix.astrbot }}-${{ matrix.hindsight }}
          path: |
            ${{ runner.temp }}/parameters.log
            ${{ runner.temp }}/parameter-evidence/live-e2e-report.json
            ${{ runner.temp }}/parameter-evidence/package-inventory.json
            ${{ runner.temp }}/parameter-evidence/*.png
            ${{ runner.temp }}/parameter-evidence/control-failure.jsonl
