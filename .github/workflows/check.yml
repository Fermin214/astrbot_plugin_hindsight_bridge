name: Plugin checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: plugin-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.scope.outputs.host }}
      models: ${{ steps.scope.outputs.models }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks for changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).splitlines()

          base = os.environ.get("BASE_SHA", "")
          try:
              files = git("diff", "--name-only", base, os.environ["HEAD_SHA"]) if (
                  base.strip("0") and os.environ["FULL_CHECK"] != "true"
              ) else git("ls-files")
          except subprocess.CalledProcessError:
              files = git("ls-files")
          code = [name for name in files if not name.endswith((".md", ".png", ".svg"))]
          python = any(
              name == "main.py" or name.startswith(("core/", "deploy/", "examples/"))
              or (name.startswith("tests/test_") and name.endswith(".py"))
              or name in {"requirements.txt", "requirements-dev.txt", "_conf_schema.json", "tests/run.py",
                          "tools/check-package.py", "tools/build-test-package.py"}
              for name in code
          )
          frontend = any(
              (name.startswith("views/") and name.endswith((".js", ".html")))
              or name == "tests/test_memory_view.js" for name in code
          )
          host = any(
              name == "main.py" or name.startswith(("core/", ".astrbot-plugin/"))
              or name in {"requirements.txt", "_conf_schema.json", "metadata.yaml",
                          "tests/integration/astrbot_smoke.py", "tests/integration/package_fixture.py"}
              for name in code
          )
          models = bool(set(code) & {
              "core/providers.py", "deploy/model_transport.py", "deploy/model_probe.py",
              "tools/check-model-protocols.py", "requirements.txt", "deploy/compose.yaml",
          })
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, enabled in (("python", python), ("frontend", frontend), ("host", host), ("models", models)):
                  output.write(f"{name}={str(enabled).lower()}\n")
          print("Selected:", ", ".join(name for name, enabled in (
              ("regressions", python), ("page", frontend), ("host", host), ("models", models),
          ) if enabled) or "syntax, metadata, package and documentation")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: node --check views/memory/app.js
      - if: steps.scope.outputs.python == 'true'
        run: python tests/run.py
      - if: steps.scope.outputs.frontend == 'true' && steps.scope.outputs.python != 'true'
        run: node tests/test_memory_view.js
      - run: python tools/check-package.py

  astrbot-smoke:
    needs: check
    if: needs.check.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build-test-package.py --output "${{ runner.temp }}/hindsight-delivery"
      - name: Official AstrBot archive installation, requests, history and upgrade
        shell: bash
        run: |
          docker run --rm --name hindsight-bridge-delivery-astrbot \
            --label hindsight-bridge.test=delivery --memory 1536m \
            -e ASTRBOT_ROOT=/verification \
            -e ASTRBOT_DASHBOARD_INITIAL_PASSWORD='Delivery-Test-2026!' \
            -v "${{ runner.temp }}/hindsight-delivery:/delivery" \
            -v "${{ github.workspace }}:/candidate-source:ro" \
            soulter/astrbot:v4.29.1 \
            python /candidate-source/tests/integration/astrbot_smoke.py \
            2>&1 | tee "${{ runner.temp }}/hindsight-delivery/astrbot-smoke.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astrbot-delivery-evidence
          path: ${{ runner.temp }}/hindsight-delivery

  hindsight-model-contracts:
    needs: check
    if: needs.check.outputs.models == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        hindsight: ["1.1.0", "1.2.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Hindsight model SDK contracts against local fixtures
        run: |
          docker run --rm --name hindsight-bridge-delivery-models \
            --label hindsight-bridge.test=delivery --network none --memory 1536m \
            -e HINDSIGHT_TEST_VERSION=${{ matrix.hindsight }} \
            -v "${{ github.workspace }}:/verify/plugins/astrbot_plugin_hindsight_bridge:ro" \
            -w /verify/plugins/astrbot_plugin_hindsight_bridge \
            ghcr.io/vectorize-io/hindsight:${{ matrix.hindsight }}-slim \
            python tools/check-model-protocols.py
