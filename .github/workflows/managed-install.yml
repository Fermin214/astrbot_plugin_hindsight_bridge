name: Managed database installation

on:
  pull_request:
    paths:
      - core/installer.py
      - deploy/compose.yaml
      - deploy/managed_service.py
      - deploy/model_probe.py
      - deploy/model_transport.py
      - deploy/postgres/**
      - tests/integration/install_startup.py
      - .github/workflows/managed-install.yml
  schedule:
    - cron: '43 10 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and verify the managed database
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            python3 tests/integration/install_startup.py --fresh-only --output "$RUNNER_TEMP/bridge-install"
          else
            python3 tests/integration/install_startup.py --output "$RUNNER_TEMP/bridge-install"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-installation
          path: |
            ${{ runner.temp }}/bridge-install/*.log
            ${{ runner.temp }}/bridge-install/result.json
          retention-days: 7
